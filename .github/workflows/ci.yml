name: ci
on:
  push:
    branches: [aisis]
  pull_request:
permissions:
  contents: read
jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - run: npm -g i pnpm@10.23.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Offline intent routing corpus (exits 1 on any mismatch)
        run: node_modules/.bin/tsx src/backend/corpus/run_corpus.mts
      - name: Multi-turn dialogs
        run: node_modules/.bin/tsx src/backend/corpus/run_dialogs.mts
      - name: Admission policy and wiring (exits 1 on any failure)
        run: node_modules/.bin/tsx src/routers/check_admission.mts
      - name: Fuzzy matching resource bounds (exits 1 on any failure)
        run: node_modules/.bin/tsx src/backend/check_fuzzy_bounds.mts
      - name: Ogg/Opus codec bounds and stitched duration (exits 1 on any failure)
        run: node_modules/.bin/tsx src/codecs/check_codecs.mts
      - name: Safety checks (negation, per-station state)
        run: node_modules/.bin/tsx src/backend/corpus/run_safety.mts
      - name: UniProxy close-code logging (exits 1 on any failure)
        run: node_modules/.bin/tsx src/routers/check_close_logging.mts
      - name: HA verify wording (exits 1 on any failure)
        run: node_modules/.bin/tsx src/backend/check_ha_verify_wording.mts
