name: private-topology
on:
  pull_request:
  push:
    branches: [aisis]
permissions:
  contents: read
concurrency:
  group: private-topology-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: gitleaks (current tree)
        run: |
          cfg=()
          if [ -f .gitleaks.toml ]; then cfg=(--config /repo/.gitleaks.toml); fi
          docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" dir "${cfg[@]}" --redact --no-banner /repo
      - name: private topology (generic patterns)
        run: python3 scripts/check_private_topology.py
      - name: private topology check detects what it should
        run: python3 scripts/check_private_topology.py --self-test
      - name: private topology check unit tests
        run: python3 -m unittest discover -s scripts -p 'test_check_private_topology.py'
